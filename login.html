<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="mainNav">
<ul class="navbar-nav me-auto mb-2 mb-lg-0">

<form class="d-flex" role="search" onsubmit="return false;"><div class="input-group">
<span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" type="search" placeholder="Search services..." id="globalSearch">
</div></form>
</div></div></nav>

<main class="container"><div class="card form-card p-4 p-md-5"><div class="text-center mb-4"><img src="hospital-logo.svg" class="rounded-circle img-fluid" width="90" height="90" alt="Hospital logo"><h2 class="page-title mt-3">Login</h2><p class="text-muted">ADP Hospital account access</p></div>
<form onsubmit="showMessage(event)"><label class="form-label">Email</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" required placeholder="name@example.com"></div>
<label class="form-label">Username</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-person"></i></span><input type="text" class="form-control" required placeholder="Username"></div>
<label class="form-label">Password</label><div class="input-group mb-4"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" class="form-control" required placeholder="Password"></div>
<div class="d-grid gap-2 d-sm-flex"><button class="btn btn-success flex-fill" type="submit">Submit</button><button class="btn btn-outline-secondary flex-fill" type="reset">Clear</button></div></form>
<div id="formAlert" class="mt-3"></div></div></main><footer class="py-4"><div class="container text-center"><small>© 2026 ADP Hospital Management System</small></div></footer>
<script>function showMessage(e){e.preventDefault();document.getElementById('formAlert').innerHTML='<div class="alert alert-info alert-dismissible fade show">Form submitted successfully for demonstration.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';}</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
