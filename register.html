<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | ADP Hospital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container"><a class="navbar-brand fw-bold" href="home.html">ADP Hospital</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="home.html">Home</a></li><li class="nav-item"><a class="nav-link" href="catalogue.html">Services</a></li><li class="nav-item"><a class="nav-link" href="login.html">Login</a></li><li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li></ul></div></div></nav>
<main class="container"><div class="card form-card p-4 p-md-5"><div class="text-center mb-4"><h2 class="page-title">Create an Account</h2><p class="text-muted">Register for the ADP Hospital portal</p></div><form onsubmit="registerUser(event)"><div class="row g-3"><div class="col-12 col-md-6"><label class="form-label">Name</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input class="form-control" required></div></div><div class="col-12 col-md-6"><label class="form-label">Hospital / Clinic Name</label><div class="input-group"><span class="input-group-text"><i class="bi bi-hospital"></i></span><input class="form-control" required></div></div><div class="col-12 col-md-6"><label class="form-label">Email</label><div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" required></div></div><div class="col-12 col-md-6"><label class="form-label">Phone Number</label><div class="input-group"><span class="input-group-text"><i class="bi bi-telephone"></i></span><input type="tel" class="form-control" required></div></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" rows="3" required></textarea></div><div class="col-12 col-md-6"><label class="form-label">Username</label><input class="form-control" required></div><div class="col-12 col-md-6"><label class="form-label">Password</label><input type="password" class="form-control" required></div></div><div class="d-grid gap-2 d-sm-flex mt-4"><button class="btn btn-success flex-fill" type="submit">Register</button><button class="btn btn-outline-secondary flex-fill" type="reset">Clear</button></div></form><div id="registerAlert" class="mt-3"></div></div></main>
<script>function registerUser(e){e.preventDefault();document.getElementById('registerAlert').innerHTML='<div class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle me-2"></i>Registration completed successfully for demonstration.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';}</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
